name: EAS Build — Motora App

on:
  push:
    branches: [main]
    paths:
      - 'MotoraApp/**'     # Só dispara quando o app nativo mudar
  workflow_dispatch:       # Permite disparar manualmente pelo GitHub

jobs:
  build:
    name: Build APK (preview)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: MotoraApp/package-lock.json

      - name: Instalar dependências
        working-directory: MotoraApp
        run: npm ci --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK (preview)
        working-directory: MotoraApp
        run: eas build --platform android --profile preview --non-interactive
